# Alembic configuration for the coordinator's SQLite store.
#
#   alembic upgrade head                # uses COORDINATOR_DB or the default path
#   COORDINATOR_DB=path.sqlite alembic upgrade head
#
# The URL here is a fallback; alembic/env.py prefers the COORDINATOR_DB
# environment variable so deployments and tests point wherever they like.
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///data/coordinator.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
