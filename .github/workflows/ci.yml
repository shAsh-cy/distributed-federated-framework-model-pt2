name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Lint needs only ruff, not the 900 MB TensorFlow stack, so it reports in
      # seconds instead of waiting on the full install.
      - name: Install ruff
        run: pip install "ruff==0.16.0"

      - name: Ruff check
        run: ruff check fl tests scripts

      - name: Ruff format check
        run: ruff format --check fl tests scripts

  test:
    runs-on: ubuntu-latest
    # TFF ships Linux-only manylinux wheels and requires Python >=3.9,<3.12, so
    # ubuntu + 3.10 is the only supported combination. There is no matrix to run.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements.txt carries the --find-links line that restores
        # jaxlib==0.4.14, which TFF pins exactly and which no longer exists on
        # PyPI. Without it this step fails to resolve.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Show resolved versions
        run: pip list | grep -Ei "tensorflow|jax|grpcio|numpy|protobuf" || true

      - name: Generate gRPC stubs
        run: python -m fl.proto._generate

      - name: Cache Fashion-MNIST
        uses: actions/cache@v4
        with:
          path: ~/.keras/datasets
          key: fashion-mnist-v1

      - name: Run tests with coverage
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          pytest --cov=fl --cov=coordinator --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: e2e (mock mode, no backend)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
