// Federated learning control plane.
//
// VERSIONING
// ----------
// Two independent version numbers travel on this wire, and conflating them is a
// common source of silent corruption:
//
//   * `protocol_version` -- the schema version of THIS FILE. Checked once, at
//     registration. A client built against a different schema is refused outright
//     rather than allowed to misinterpret field numbers.
//
//   * `model_version` -- which global model a set of weights was trained from.
//     The server increments it every time it publishes a new global model. An
//     update computed against model N is only valid input to the aggregation
//     that produces model N+1; submitting it later would fold a stale gradient
//     into an unrelated model. The server rejects those (REJECTED_STALE_MODEL).
//
// The package is versioned too (`fl.v1`), so an incompatible future revision can
// be introduced as `fl.v2` and served side by side.

syntax = "proto3";

package fl.v1;

// Bumped whenever this schema changes incompatibly.
//
// V2 added an explicit per-tensor dtype and fixed the canonical tensor layout
// (below) so that clients built on different ML frameworks can interoperate.
// V1 lacked the dtype field and made no layout promise; a V1 client's payload
// would be reinterpreted rather than converted, so V1 is refused, not accepted
// leniently.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_V1 = 1;
  PROTOCOL_VERSION_V2 = 2;
  // V3 is additive over V2: same weight wire format and the same three core RPCs,
  // plus the secure-aggregation RPCs below and one new RegisterRequest field
  // (the client's masking public key). A V2 client and a V3 client are accepted
  // by the same server; only a V3 client may run a secure round. The additions
  // are new messages and new service methods, so a V2-only server simply reports
  // the secure RPCs UNIMPLEMENTED.
  PROTOCOL_VERSION_V3 = 3;
}

// ---------------------------------------------------------------------------
// Weight payloads
// ---------------------------------------------------------------------------
//
// CANONICAL TENSOR LAYOUT (the wire contract every framework converts to)
// ----------------------------------------------------------------------
// Buffers are C-contiguous (row-major) with these axis semantics:
//
//   Conv2D kernel   (kernel_h, kernel_w, in_channels, out_channels)
//   Conv2D bias     (out_channels,)
//   Dense kernel    (in_features, out_features)
//   Dense bias      (out_features,)
//   BatchNorm       four tensors named gamma, beta, moving_mean,
//                   moving_variance, each (channels,)
//
// Dense kernels that FOLLOW a flatten of a convolutional feature map assume
// the flatten walked the map in (height, width, channel) order — i.e. the
// input axis of that kernel is indexed h*W*C + w*C + c.
//
// WHY THIS LAYOUT. It is TensorFlow's native layout, chosen deliberately
// rather than neutrally invented: the server's aggregation stack (numpy plus
// TFF's DP factory) consumes exactly this form, so the aggregator performs
// zero conversions and stays framework-blind — it cannot tell which framework
// produced an update because every update is byte-compatible by the time it
// arrives. Frameworks whose native layout differs (PyTorch: Conv2D
// (out, in, h, w), Linear (out, in), channels-first activations and therefore
// a (channel, height, width) flatten order) convert at their own edge, in
// their adapter, and nowhere else.
//
// The dtype travels explicitly so a decoder never guesses element size.
// FLOAT32 is the only supported value; anything else is rejected at decode,
// not coerced, because silent casting would change the numerics the privacy
// accounting was computed over.
enum TensorDtype {
  TENSOR_DTYPE_UNSPECIFIED = 0;
  TENSOR_DTYPE_FLOAT32 = 1;
}

// One tensor of a model's weight list. Weights are sent as raw little-endian
// buffers plus an explicit shape and dtype, rather than as `repeated float`,
// so a 225k-parameter model costs ~0.86 MiB instead of paying varint overhead
// per element.
message Tensor {
  // Canonical name, e.g. "conv1/kernel", "bn1/gamma". Stable across
  // frameworks: adapters map native parameter names to these.
  string name = 1;
  repeated int32 shape = 2;
  // Raw little-endian buffer, C-contiguous, in the canonical layout above.
  // Length must equal itemsize(dtype) * prod(shape).
  bytes data = 3;
  TensorDtype dtype = 4;
}

// An ordered model weight list in canonical form. Order matches the canonical
// architecture spec (identical to keras Model.get_weights() order).
message ModelWeights {
  repeated Tensor tensors = 1;
}

// ---------------------------------------------------------------------------
// Registration
// ---------------------------------------------------------------------------

message RegisterRequest {
  ProtocolVersion protocol_version = 1;
  // Optional stable identity so a restarted client can reclaim its own shard
  // instead of being handed a fresh one.
  string desired_client_id = 2;
  // Self-reported local training framework (e.g. "tensorflow", "torch").
  // OBSERVABILITY ONLY: the server logs it at registration and must never
  // branch on it. The wire format above is the whole interoperability
  // contract; a server that treats frameworks differently has broken the
  // design this field exists to help verify.
  string framework = 3;
  // The client's Diffie-Hellman public key for pairwise masking (a 2048-bit
  // group element, big-endian). Announced ONCE at registration so the server
  // holds every client's key before a cohort is sampled, and a secure round's
  // roster is then just a subset it already has. Empty for V2 clients, which do
  // not run secure aggregation.
  bytes masking_public_key = 4;
}

message RegisterResponse {
  bool accepted = 1;
  string client_id = 2;
  // Index of the data shard this client owns, in [0, num_clients).
  int32 shard_index = 3;
  int32 num_clients = 4;
  // Populated when accepted is false.
  string rejection_reason = 5;
}

// ---------------------------------------------------------------------------
// Round participation
// ---------------------------------------------------------------------------

enum RoundAction {
  ROUND_ACTION_UNSPECIFIED = 0;
  // Client is selected this round: train and submit before the deadline.
  ROUND_ACTION_TRAIN = 1;
  // Client is not in this round's sample: sleep and poll again.
  ROUND_ACTION_WAIT = 2;
  // All rounds finished; client may exit.
  ROUND_ACTION_STOP = 3;
}

message GetGlobalModelRequest {
  string client_id = 1;
}

message GetGlobalModelResponse {
  RoundAction action = 1;
  int32 round = 2;
  // The model version these weights represent. Must be echoed back in
  // SubmitUpdateRequest.model_version.
  int64 model_version = 3;
  ModelWeights weights = 4;
  // Wall-clock seconds remaining before this round's barrier closes.
  double seconds_until_deadline = 5;
  // Server-dictated local training hyperparameters, so a client never has to be
  // configured consistently with the server by hand.
  int32 local_epochs = 6;
  int32 batch_size = 7;
  double learning_rate = 8;
  double momentum = 9;
}

// ---------------------------------------------------------------------------
// Update submission
// ---------------------------------------------------------------------------

enum UpdateStatus {
  UPDATE_STATUS_UNSPECIFIED = 0;
  UPDATE_STATUS_ACCEPTED = 1;
  // model_version predates the round currently being aggregated.
  UPDATE_STATUS_REJECTED_STALE_MODEL = 2;
  // Arrived after the round deadline; the round already closed without it.
  UPDATE_STATUS_REJECTED_DEADLINE_PASSED = 3;
  // client_id was never registered, or was evicted.
  UPDATE_STATUS_REJECTED_UNKNOWN_CLIENT = 4;
  // Client was not sampled for this round.
  UPDATE_STATUS_REJECTED_NOT_SELECTED = 5;
  // Payload failed validation: shape mismatch, non-finite values, bad length.
  UPDATE_STATUS_REJECTED_INVALID_PAYLOAD = 6;
}

message SubmitUpdateRequest {
  string client_id = 1;
  int32 round = 2;
  // Global model version this update was trained from. Aggregation weights it
  // only if it matches the round currently open.
  int64 model_version = 3;
  ModelWeights weights = 4;
  // Number of local training examples. This is the FedAvg weighting term n_k;
  // the server does not infer it, because only the client knows its shard size.
  int64 num_examples = 5;
  // Optional local training telemetry, logged but never used for aggregation.
  double train_loss = 6;
  double train_accuracy = 7;
}

message SubmitUpdateResponse {
  UpdateStatus status = 1;
  string detail = 2;
  // Version the server currently holds, so a stale client can resynchronise.
  int64 current_model_version = 3;
}

// ---------------------------------------------------------------------------
// Secure aggregation (pairwise masking, no-DP path)
// ---------------------------------------------------------------------------
//
// These messages carry the Bonawitz et al. (CCS 2017) protocol that
// fl/secure_aggregation.py implements. They are used ONLY by V3 clients running
// a secure round; the weight payload never travels in the clear on this path.
// A masked update is a vector of uint64 words (raw little-endian), NOT a
// ModelWeights: masks cancel exactly only in Z_2^64, so the words are the wire
// form and the server reshapes and unmasks them. See docs/secure_aggregation.md.

// One cohort member as the rest of the cohort sees it: ordering position (fixes
// the pairwise-mask sign convention) and public key. No secret here.
message SecureRosterEntry {
  string client_id = 1;
  int32 order = 2;
  bytes public_key = 3;  // big-endian 2048-bit group element
}

// One Shamir share of one client's one secret, held by one other client.
// `value` is a big-endian field element of GF(2^521 - 1) (up to 66 bytes);
// `kind` is "self_mask" or "key_seed".
message SecureShare {
  string owner = 1;
  string kind = 2;
  int32 index = 3;
  bytes value = 4;
}

// A bundle of shares one client sends for one recipient to hold. Shares are held
// by CLIENTS, never reconstructed by the server, which is what stops the server
// unmasking an individual update.
message SecureShareParcel {
  string recipient_id = 1;
  repeated SecureShare shares = 2;
}

// A single (owner, kind) the server asks a responder to reveal during recovery.
message SecureRevealItem {
  string owner = 1;
  string kind = 2;
}

message GetSecureRoundRequest {
  string client_id = 1;
}

// The secure analogue of GetGlobalModelResponse: adds the cohort roster and the
// Shamir threshold. A client needs only this (plus its own secrets) to mask.
message GetSecureRoundResponse {
  RoundAction action = 1;
  int32 round = 2;
  int64 model_version = 3;
  ModelWeights weights = 4;
  double seconds_until_deadline = 5;
  int32 local_epochs = 6;
  int32 batch_size = 7;
  double learning_rate = 8;
  double momentum = 9;
  repeated SecureRosterEntry roster = 10;
  int32 threshold = 11;
}

message SubmitSecureSharesRequest {
  string client_id = 1;
  int32 round = 2;
  repeated SecureShareParcel parcels = 3;
}

message SubmitSecureSharesResponse {
  UpdateStatus status = 1;
  string detail = 2;
}

message SubmitMaskedUpdateRequest {
  string client_id = 1;
  int32 round = 2;
  int64 model_version = 3;
  // Masked update: raw little-endian uint64 words. Length is num_words * 8.
  bytes masked_words = 4;
  int64 num_words = 5;
}

message SubmitMaskedUpdateResponse {
  UpdateStatus status = 1;
  string detail = 2;
  int64 current_model_version = 3;
}

message GetRevealRequest {
  string client_id = 1;
  int32 round = 2;
}

// Sent once recovery opens: which shares this responder must reveal, and the
// shares it holds (delivered here rather than earlier, since a client needs them
// only to reveal). `ready` is false while the round is still collecting masked
// updates, so the client polls.
message GetRevealResponse {
  bool ready = 1;
  int32 round = 2;
  repeated SecureRevealItem needed = 3;
  repeated SecureShare held_shares = 4;
}

message SubmitRevealsRequest {
  string client_id = 1;
  int32 round = 2;
  repeated SecureShare shares = 3;
}

message SubmitRevealsResponse {
  UpdateStatus status = 1;
  string detail = 2;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service FederatedLearning {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetGlobalModel(GetGlobalModelRequest) returns (GetGlobalModelResponse);
  rpc SubmitUpdate(SubmitUpdateRequest) returns (SubmitUpdateResponse);

  // Secure-aggregation round (V3). Implemented by fl.secure_server; a plain
  // server leaves these UNIMPLEMENTED, which a non-secure client never calls.
  rpc GetSecureRound(GetSecureRoundRequest) returns (GetSecureRoundResponse);
  rpc SubmitSecureShares(SubmitSecureSharesRequest) returns (SubmitSecureSharesResponse);
  rpc SubmitMaskedUpdate(SubmitMaskedUpdateRequest) returns (SubmitMaskedUpdateResponse);
  rpc GetRevealShares(GetRevealRequest) returns (GetRevealResponse);
  rpc SubmitReveals(SubmitRevealsRequest) returns (SubmitRevealsResponse);
}
